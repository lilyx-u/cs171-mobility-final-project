<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="Helvetica, Arial, sans-serif"><rect width="880" height="520" fill="#fafaf8"/><line x1="0" y1="0" x2="0" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="40" y1="0" x2="40" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="80" y1="0" x2="80" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="120" y1="0" x2="120" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="160" y1="0" x2="160" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="200" y1="0" x2="200" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="240" y1="0" x2="240" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="280" y1="0" x2="280" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="320" y1="0" x2="320" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="360" y1="0" x2="360" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="400" y1="0" x2="400" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="440" y1="0" x2="440" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="480" y1="0" x2="480" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="520" y1="0" x2="520" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="560" y1="0" x2="560" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="600" y1="0" x2="600" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="640" y1="0" x2="640" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="680" y1="0" x2="680" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="720" y1="0" x2="720" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="760" y1="0" x2="760" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="800" y1="0" x2="800" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="840" y1="0" x2="840" y2="520" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="0" x2="880" y2="0" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="40" x2="880" y2="40" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="80" x2="880" y2="80" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="120" x2="880" y2="120" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="160" x2="880" y2="160" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="200" x2="880" y2="200" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="240" x2="880" y2="240" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="280" x2="880" y2="280" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="320" x2="880" y2="320" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="360" x2="880" y2="360" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="400" x2="880" y2="400" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="440" x2="880" y2="440" stroke="#eeeeea" stroke-width="1"/><line x1="0" y1="480" x2="880" y2="480" stroke="#eeeeea" stroke-width="1"/><text x="24" y="34" font-size="20" font-weight="bold" fill="#1b2233">Twin counties: same floor, different ceiling</text><text x="24" y="54" font-size="13" fill="#555b6b" font-style="italic">Can two places give poor children the same outcome but rich children very different ones?</text><rect x="762" y="16" width="94" height="22" rx="11" fill="#1b2233"/><text x="809" y="31" font-size="11" fill="#fff" text-anchor="middle">DESIGN DRAFT</text><line x1="120" y1="420.0" x2="520" y2="420.0" stroke="#d9d9d4"/><text x="112" y="424.0" font-size="11" fill="#8a8f9c" text-anchor="end">30th</text><line x1="120" y1="340.0" x2="520" y2="340.0" stroke="#d9d9d4"/><text x="112" y="344.0" font-size="11" fill="#8a8f9c" text-anchor="end">40th</text><line x1="120" y1="260.0" x2="520" y2="260.0" stroke="#d9d9d4"/><text x="112" y="264.0" font-size="11" fill="#8a8f9c" text-anchor="end">50th</text><line x1="120" y1="180.0" x2="520" y2="180.0" stroke="#d9d9d4"/><text x="112" y="184.0" font-size="11" fill="#8a8f9c" text-anchor="end">60th</text><line x1="120" y1="100.0" x2="520" y2="100.0" stroke="#d9d9d4"/><text x="112" y="104.0" font-size="11" fill="#8a8f9c" text-anchor="end">70th</text><text x="120.0" y="440" font-size="12" fill="#555b6b" text-anchor="middle">p25</text><text x="320.0" y="440" font-size="12" fill="#555b6b" text-anchor="middle">p50</text><text x="520.0" y="440" font-size="12" fill="#555b6b" text-anchor="middle">p75</text><text x="320.0" y="460" font-size="12" fill="#555b6b" text-anchor="middle">parents' income percentile</text><text transform="translate(50,260.0) rotate(-90)" font-size="12" fill="#555b6b" text-anchor="middle">child's adult income rank</text><polygon points="120.0,347.91999999999996 320.0,296.87999999999994 520.0,248.07999999999996 520.0,169.28 320.0,257.28000000000003 120.0,349.28" fill="#6250d6" opacity="0.12"/><polyline points="120.0,347.91999999999996 320.0,296.87999999999994 520.0,248.07999999999996" fill="none" stroke="#d6422a" stroke-width="3"/><circle cx="120.0" cy="347.91999999999996" r="5" fill="#d6422a" stroke="#fff" stroke-width="1.5"/><circle cx="320.0" cy="296.87999999999994" r="5" fill="#d6422a" stroke="#fff" stroke-width="1.5"/><circle cx="520.0" cy="248.07999999999996" r="5" fill="#d6422a" stroke="#fff" stroke-width="1.5"/><text x="530.0" y="252.07999999999996" font-size="12" fill="#d6422a" font-weight="bold">Bronx County, NY: 51th</text><polyline points="120.0,349.28 320.0,257.28000000000003 520.0,169.28" fill="none" stroke="#2a78d6" stroke-width="3"/><circle cx="120.0" cy="349.28" r="5" fill="#2a78d6" stroke="#fff" stroke-width="1.5"/><circle cx="320.0" cy="257.28000000000003" r="5" fill="#2a78d6" stroke="#fff" stroke-width="1.5"/><circle cx="520.0" cy="169.28" r="5" fill="#2a78d6" stroke="#fff" stroke-width="1.5"/><text x="530.0" y="173.28" font-size="12" fill="#2a78d6" font-weight="bold">Campbell County, KY: 61th</text><text x="110.0" y="335.91999999999996" font-size="11" fill="#1b2233" text-anchor="end" font-weight="bold">both 39th</text><text x="416.0" y="212.68" font-size="11" fill="#6250d6" font-weight="bold">10-point</text><text x="416.0" y="226.68" font-size="11" fill="#6250d6" font-weight="bold">difference</text><rect x="120" y="476" width="400" height="30" rx="5" fill="#fff" stroke="#1b2233" stroke-width="1.5"/><text x="130" y="496" font-size="12" fill="#8a8f9c">pick a county... its twin is found automatically</text><rect x="640" y="100" width="220" height="94" rx="4" fill="#fff" stroke="#6250d6" stroke-width="1" /><text x="648" y="118" font-size="11" fill="#1b2233">Insight: a single county average</text><text x="648" y="134" font-size="11" fill="#1b2233">hides this. Both counties give</text><text x="648" y="150" font-size="11" fill="#1b2233">poor children the 39th; rich</text><text x="648" y="166" font-size="11" fill="#1b2233">children reach 51th in one and</text><text x="648" y="182" font-size="11" fill="#1b2233">61th in the other.</text><rect x="640" y="200" width="220" height="94" rx="4" fill="#fff" stroke="#6250d6" stroke-width="1" stroke-dasharray="4 3"/><text x="648" y="218" font-size="11" fill="#1b2233">Twin rule (derive_stats.py):</text><text x="648" y="234" font-size="11" fill="#1b2233">large counties, p25 outcome</text><text x="648" y="250" font-size="11" fill="#1b2233">within 0.5 pts, gap differs by</text><text x="648" y="266" font-size="11" fill="#1b2233">8+ pts. Top 12 pairs are</text><text x="648" y="282" font-size="11" fill="#1b2233">precomputed in derived.json.</text><rect x="640" y="300" width="220" height="110" rx="4" fill="#fff" stroke="#6250d6" stroke-width="1" stroke-dasharray="4 3"/><text x="648" y="318" font-size="11" fill="#1b2233">Interaction: choose any county;</text><text x="648" y="334" font-size="11" fill="#1b2233">the app finds its nearest twin.</text><text x="648" y="350" font-size="11" fill="#1b2233">Both curves drawn, difference</text><text x="648" y="366" font-size="11" fill="#1b2233">shaded. Hover a point for the</text><text x="648" y="382" font-size="11" fill="#1b2233">exact value. A small map inset</text><text x="648" y="398" font-size="11" fill="#1b2233">shows where the two are.</text><rect x="640" y="410" width="220" height="62" rx="4" fill="#fff" stroke="#6250d6" stroke-width="1" stroke-dasharray="4 3"/><text x="648" y="428" font-size="11" fill="#1b2233">Why it matters: mobility should</text><text x="648" y="444" font-size="11" fill="#1b2233">be reported by parent income,</text><text x="648" y="460" font-size="11" fill="#1b2233">not as one county number.</text></svg>